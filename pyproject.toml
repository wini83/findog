[project]
name = "findog"
version = "0.7.1"
description = "A simple program to keep your payments in check"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "wini83" }
]

dependencies = [
  "dropbox~=12.0.2",
  "openpyxl~=3.1.5",
  "click~=8.1.8",
  "colorama",
  "jinja2~=3.1.6",
  "loguru~=0.7.3",
  "numpy~=2.2.4",
  "beautifulsoup4~=4.13.3",
  "pandas~=2.2.3",
  "matplotlib~=3.11.1",
  "requests~=2.34.2",
  "PyYAML~=6.0.2",
  "pydantic~=2.13.4",
  "pydantic-settings~=2.14.2",
]

[dependency-groups]
dev = [
  "pre-commit",
  "ruff",
  "mypy",
  "commitizen",
  "pytest",
  "pytest-cov",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.7.1"
tag_format = "v$version"
version_files = ["pyproject.toml"]
update_changelog_on_bump = true
annotated_tags = true

[tool.ruff]
line-length = 88
target-version = "py312"

lint.select = [
  "E", "F",        # podstawowa higiena
  "I",             # import sorting (isort RIP)
  "N",             # naming
  "UP",            # pyupgrade
  "B",             # bugbear
  "RUF",           # reguły specyficzne dla Ruffa
  "RET",           # uproszczenia return/else
  "SIM",           # uproszczenia kodu
  "C4",            # comprehensions
  "A",             # shadowing wbudowanych nazw
]

exclude = [
  ".git",
  ".venv",
  "__pycache__",
  "build",
  "dist",
]

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint.per-file-ignores]
"main.py" = ["RET505"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
branch = true
omit = [
  "tests/*",
  "data/*",
  "secrets/*",
  "__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]
