[project]
name = "findog-legacy-adapter"
version = "0.7.2"
description = "Adapter that reads legacy Findog workbooks into Python objects"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "wini83" }
]

dependencies = [
  "dropbox~=12.2.1",
  "openpyxl~=3.1.5",
  "numpy~=2.5.2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["findog_legacy_adapter*"]

[dependency-groups]
dev = [
  "click>=8.4.2,<8.6.0",
  "python-dotenv~=1.2.1",
  "PyYAML~=6.0.2",
  "pre-commit",
  "ruff",
  "mypy",
  "commitizen",
  "pytest",
  "pytest-cov",
  "build",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.7.2"
tag_format = "v$version"
version_files = ["pyproject.toml"]
update_changelog_on_bump = true
annotated_tags = true

[tool.ruff]
line-length = 88
target-version = "py312"

lint.select = [
  "E", "F",        # podstawowa higiena
  "I",             # import sorting (isort RIP)
  "N",             # naming
  "UP",            # pyupgrade
  "B",             # bugbear
  "RUF",           # reguły specyficzne dla Ruffa
  "RET",           # uproszczenia return/else
  "SIM",           # uproszczenia kodu
  "C4",            # comprehensions
  "A",             # shadowing wbudowanych nazw
]

exclude = [
  ".git",
  ".venv",
  "__pycache__",
  "build",
  "dist",
]

[tool.ruff.format]
quote-style = "preserve"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
branch = true
omit = [
  "tests/*",
  "data/*",
  "secrets/*",
  "__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]
